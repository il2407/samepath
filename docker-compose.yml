services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: samepath
      POSTGRES_PASSWORD: samepath
      POSTGRES_DB: samepath_dev
    ports:
      - "5432:5432"
    volumes:
      - samepath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samepath -d samepath_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samepath_postgres_data:
